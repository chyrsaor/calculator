<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <input type="text" id="display">
        <div class="upperlevel"><button class="btn">clear</button><button class="btn">%</button></div>
        <div class="firstlevel"><button class="btn">7</button><button class="btn" >8</button><button class="btn">9</button><button class="btn">/</button></div>
        <div class="secondlevel"><button  class="btn">4</button><button class="btn">5</button><button class="btn">6</button><button class="btn">*</button></div>
        <div class="thirdlevel"><button  class="btn">1</button><button class="btn">2</button><button class="btn">3</button><button class="btn">-</button></div>
        <div class="fourthlevel"><button  class="btn">0</button><button class="btn">.</button><button id="equal" class="btn">=</button><button class="btn">+</button></div>
    </div>
    <script src="main.js"></script>
</body>
</html>
